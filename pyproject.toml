[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-monitor"
version = "0.1.0"
description = "Pipeline ETL educacional para monitorar indicadores de empresas listadas na B3."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "yfinance>=0.2.54",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
    "SQLAlchemy>=1.4.49,<3",
    "psycopg2-binary>=2.9",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Instale com o arquivo de constraints oficial da versão, por exemplo:
# pip install -e ".[airflow]" --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
airflow = ["apache-airflow>=3.0,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]